name: Hephaestus Research Signals

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1-5'

# Publishing uses the Hephaestus Pipeline Bot app token minted below, which is the
# only identity allowed to push to main directly; GITHUB_TOKEN needs no write access.
permissions:
  contents: read

concurrency:
  group: hephaestus-main-publisher
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEPHAESTUS_PREDICTION_MODEL: qwen2.5:7b-instruct

jobs:
  generate-research-signals:
    name: Generate top-50 graph research signals
    # Same pinned runner as the GPU pipeline (custom label on server1).
    runs-on: [self-hosted, nvidia-gpu, hephaestus]
    timeout-minutes: 55

    steps:
      - name: Mint pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Used for the initial fetch only; the publish step mints its own token.
          token: ${{ steps.app-token.outputs.token }}
          # Same as the GPU pipeline: the publish step mints its own token, and a
          # persisted checkout credential would be sent alongside it (HTTP 400).
          persist-credentials: false
          # Both workflows now run on the same pinned runner and share its workspace.
          # The default `git clean -ffdx` would delete the git-ignored SQLite graph
          # every weekday, forcing the GPU pipeline to re-seed and re-crawl.
          clean: false

      - name: Refresh main before generation
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up virtual environment
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip install pytest

      - name: Ensure Ollama scenario model
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "Ollama is not installed or not on PATH for this self-hosted runner."
            exit 1
          fi
          if ! ollama list >/tmp/hephaestus-ollama.txt 2>/tmp/hephaestus-ollama.err; then
            nohup ollama serve >/tmp/hephaestus-ollama-serve.log 2>&1 &
            for attempt in $(seq 1 30); do
              ollama list >/tmp/hephaestus-ollama.txt 2>/tmp/hephaestus-ollama.err && break
              sleep 2
            done
          fi
          if ! ollama list >/tmp/hephaestus-ollama.txt 2>/tmp/hephaestus-ollama.err; then
            cat /tmp/hephaestus-ollama.err
            exit 1
          fi
          if ! awk '{print $1}' /tmp/hephaestus-ollama.txt | grep -Fx "$HEPHAESTUS_PREDICTION_MODEL"; then
            ollama pull "$HEPHAESTUS_PREDICTION_MODEL"
          fi

      - name: Generate bounded research signals
        run: |
          venv/bin/python backend/generate_predictions.py \
            --limit 50 \
            --use-ollama \
            --require-ollama \
            --ollama-model "$HEPHAESTUS_PREDICTION_MODEL"

      - name: Validate prediction export
        run: |
          venv/bin/python -m pytest tests/test_predictions.py -q
          venv/bin/python backend/validate_predictions.py

      # api.github.com was unreachable for about 40 seconds on 2026-10-09 and this step
      # failed a job whose whole day of work was finished, so nothing was published.
      # Retry with growing waits (about 15 minutes in all) and publish with whichever
      # attempt works. Attempt N runs only when attempt N-1 failed: a skipped attempt
      # (an earlier one succeeded) has outcome 'skipped', which stops the chain.
      - name: Mint fresh publish token
        # App installation tokens expire after one hour and this job runs for up to
        # four; the checkout token is stale by the time the results are pushed.
        id: push-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Wait before minting the publish token again (attempt 2 of 5)
        if: steps.push-token.outcome == 'failure'
        run: sleep 60

      - name: Mint fresh publish token (attempt 2 of 5)
        id: push-token-2
        if: steps.push-token.outcome == 'failure'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Wait before minting the publish token again (attempt 3 of 5)
        if: steps.push-token-2.outcome == 'failure'
        run: sleep 120

      - name: Mint fresh publish token (attempt 3 of 5)
        id: push-token-3
        if: steps.push-token-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Wait before minting the publish token again (attempt 4 of 5)
        if: steps.push-token-3.outcome == 'failure'
        run: sleep 240

      - name: Mint fresh publish token (attempt 4 of 5)
        id: push-token-4
        if: steps.push-token-3.outcome == 'failure'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Wait before minting the publish token again (attempt 5 of 5)
        if: steps.push-token-4.outcome == 'failure'
        run: sleep 480

      - name: Mint fresh publish token (attempt 5 of 5)
        id: push-token-5
        if: steps.push-token-4.outcome == 'failure'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Commit and push research signals
        env:
          PUSH_TOKEN: ${{ steps.push-token.outputs.token || steps.push-token-2.outputs.token || steps.push-token-3.outputs.token || steps.push-token-4.outputs.token || steps.push-token-5.outputs.token }}
          # Five pushes with 45-second steps (7.5 minutes of waiting) instead of three with
          # 20-second steps: an outage that outlasts a minute should not cost the day.
          PUSH_ATTEMPTS: "5"
          PUSH_BACKOFF_SECONDS: "45"
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::No publish token: the GitHub API stayed unreachable through 5 attempts. The next scheduled run regenerates and publishes."
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Remove the credential on every exit path: a failed rebase or a rejected
          # push would otherwise leave the token in .git/config on the self-hosted
          # runner until the next checkout.
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git add docs/predictions.json docs/prediction_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated research signals: Update top-50 graph predictions"
            # A conflicting rebase must not be left half-applied on the self-hosted
            # runner, or every later run fails at checkout.
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "Rebase onto origin/main failed; aborted without publishing."
              exit 1
            fi
            bash scripts/publish_with_retry.sh
          else
            echo "No research signal changes to publish."
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
