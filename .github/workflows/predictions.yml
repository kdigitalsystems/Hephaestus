name: Hephaestus Research Signals

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1-5'

# Publishing uses the Hephaestus Pipeline Bot app token minted below, which is the
# only identity allowed to push to main directly; GITHUB_TOKEN needs no write access.
permissions:
  contents: read

concurrency:
  group: hephaestus-main-publisher
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEPHAESTUS_PREDICTION_MODEL: qwen2.5:7b-instruct

jobs:
  generate-research-signals:
    name: Generate top-50 graph research signals
    runs-on: [self-hosted, nvidia-gpu]
    timeout-minutes: 55

    steps:
      - name: Mint pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Used for the initial fetch only; the publish step mints its own token.
          token: ${{ steps.app-token.outputs.token }}
          # Same as the GPU pipeline: the publish step mints its own token, and a
          # persisted checkout credential would be sent alongside it (HTTP 400).
          persist-credentials: false

      - name: Refresh main before generation
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up virtual environment
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip install pytest

      - name: Ensure Ollama scenario model
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "Ollama is not installed or not on PATH for this self-hosted runner."
            exit 1
          fi
          if ! ollama list >/tmp/hephaestus-ollama.txt 2>/tmp/hephaestus-ollama.err; then
            nohup ollama serve >/tmp/hephaestus-ollama-serve.log 2>&1 &
            for attempt in $(seq 1 30); do
              ollama list >/tmp/hephaestus-ollama.txt 2>/tmp/hephaestus-ollama.err && break
              sleep 2
            done
          fi
          if ! ollama list >/tmp/hephaestus-ollama.txt 2>/tmp/hephaestus-ollama.err; then
            cat /tmp/hephaestus-ollama.err
            exit 1
          fi
          if ! awk '{print $1}' /tmp/hephaestus-ollama.txt | grep -Fx "$HEPHAESTUS_PREDICTION_MODEL"; then
            ollama pull "$HEPHAESTUS_PREDICTION_MODEL"
          fi

      - name: Generate bounded research signals
        run: |
          venv/bin/python backend/generate_predictions.py \
            --limit 50 \
            --use-ollama \
            --require-ollama \
            --ollama-model "$HEPHAESTUS_PREDICTION_MODEL"

      - name: Validate prediction export
        run: |
          venv/bin/python -m pytest tests/test_predictions.py -q
          venv/bin/python backend/validate_predictions.py

      - name: Mint fresh publish token
        id: push-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Commit and push research signals
        env:
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git add docs/predictions.json docs/prediction_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated research signals: Update top-50 graph predictions"
            # A conflicting rebase must not be left half-applied on the self-hosted
            # runner, or every later run fails at checkout.
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "Rebase onto origin/main failed; aborted without publishing."
              exit 1
            fi
            git push origin main
          else
            echo "No research signal changes to publish."
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
