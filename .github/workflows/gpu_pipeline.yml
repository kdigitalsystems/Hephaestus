name: Local GPU AI Pipeline

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 3 * * *'

# Publishing uses the Hephaestus Pipeline Bot app token minted below, which is the
# only identity allowed to push to main directly; GITHUB_TOKEN needs no write access.
permissions:
  contents: read

concurrency:
  group: hephaestus-main-publisher
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-ai-discovery:
    runs-on: [self-hosted, nvidia-gpu]
    # Recent runs take 20 minutes to ~2h45m. A hung Ollama call must not pin the single
    # GPU runner and the shared publisher concurrency group for the 6-hour default.
    timeout-minutes: 240
    env:
      HEPHAESTUS_EXTRACTION_MODEL: llama3.1:8b
      HEPHAESTUS_REVIEW_MODELS: qwen2.5:7b-instruct,llama3.1:8b,mistral:7b-instruct
      HEPHAESTUS_REVIEW_LIMIT: "200"
      # Budget: metrics <= ~35 min, discovery 100 min (+ one bounded extraction),
      # review 55 min, export/pages/publish ~5 min, inside the 240-minute job timeout.
      HEPHAESTUS_DISCOVERY_MAX_SECONDS: "6000"
      HEPHAESTUS_REVIEW_MAX_SECONDS: "3300"
      HEPHAESTUS_REVIEW_MIN_CONFIDENCE: "0.85"
      HEPHAESTUS_REVIEW_CONSENSUS_MIN_VOTES: "2"
      HEPHAESTUS_REVIEW_CONSENSUS_MIN_RATIO: "0.66"

    steps:
      - name: Mint pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The default clean runs `git clean -ffdx`, which deletes the git-ignored
          # SQLite graph (backend/supply_chain.db) on every run and forces a full
          # re-seed plus a 12k-ticker market-data crawl that Yahoo throttles.
          clean: false

      - name: Refresh main before generation
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Virtual Environment and Dependencies
        run: |
          echo "Creating virtual environment..."
          python3 -m venv venv
          
          echo "Installing dependencies inside venv..."
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - name: Ensure Ollama Review Model
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "Ollama is not installed or not on PATH for this runner."
            exit 1
          fi

          if ! ollama list >/tmp/ollama-list.txt 2>/tmp/ollama-list.err; then
            echo "Ollama is installed but the local service is not responding. Starting ollama serve..."
            nohup ollama serve >/tmp/ollama-serve.log 2>&1 &
            for attempt in $(seq 1 30); do
              if ollama list >/tmp/ollama-list.txt 2>/tmp/ollama-list.err; then
                break
              fi
              sleep 2
            done
          fi

          if ! ollama list >/tmp/ollama-list.txt 2>/tmp/ollama-list.err; then
            echo "Ollama did not become ready. Recent error:"
            cat /tmp/ollama-list.err
            exit 1
          fi

          IFS=',' read -ra REVIEW_MODELS <<< "$HEPHAESTUS_REVIEW_MODELS"
          # The extraction model is as essential as the reviewers: without it every
          # company logs "model not found" and discovery silently produces nothing.
          for MODEL in "${REVIEW_MODELS[@]}" "$HEPHAESTUS_EXTRACTION_MODEL"; do
            MODEL="$(echo "$MODEL" | xargs)"
            if [ -z "$MODEL" ]; then
              continue
            fi
            if ! awk '{print $1}' /tmp/ollama-list.txt | grep -Fx "$MODEL"; then
              echo "Pulling missing review model: $MODEL"
              ollama pull "$MODEL"
              ollama list >/tmp/ollama-list.txt
            fi
          done

          echo "Ollama models are ready: extraction=$HEPHAESTUS_EXTRACTION_MODEL review=$HEPHAESTUS_REVIEW_MODELS"

      - name: Update Market Metrics
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          # Failsafe: rebuild when the DB is missing, empty, missing tables, or has no seeded nodes.
          if ! venv/bin/python backend/db_health.py --require-nodes; then
            echo "Database is not ready. Bootstrapping from scratch..."
            venv/bin/python backend/database.py
            venv/bin/python backend/seed_db.py
          fi
          
          echo "Updating live financial metrics..."
          venv/bin/python backend/update_metrics.py

      - name: Execute AI Review Pipeline & Export
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          echo "Running local GPU discovery..."
          venv/bin/python backend/auto_discover_edges.py --limit 500

          echo "Reapplying persisted edge review decisions..."
          venv/bin/python backend/edge_review_decisions.py apply

          echo "Reviewing pending AI edges with local Ollama model consensus..."
          venv/bin/python backend/review_edges_with_ollama.py \
            --models "$HEPHAESTUS_REVIEW_MODELS" \
            --status pending \
            --limit "$HEPHAESTUS_REVIEW_LIMIT" \
            --apply \
            --max-seconds "$HEPHAESTUS_REVIEW_MAX_SECONDS" \
            --min-approve "$HEPHAESTUS_REVIEW_MIN_CONFIDENCE" \
            --min-reverse "$HEPHAESTUS_REVIEW_MIN_CONFIDENCE" \
            --min-reject "$HEPHAESTUS_REVIEW_MIN_CONFIDENCE" \
            --consensus-min-votes "$HEPHAESTUS_REVIEW_CONSENSUS_MIN_VOTES" \
            --consensus-min-ratio "$HEPHAESTUS_REVIEW_CONSENSUS_MIN_RATIO" \
            --report reports/ollama_edge_review_daily.csv

          echo "Cleaning up non-supply reviewed edges before publishing..."
          venv/bin/python backend/cleanup_reviewed_edges.py

          echo "Persisting reviewed edge decisions..."
          venv/bin/python backend/edge_review_decisions.py export

          echo "Auditing relationship quality..."
          venv/bin/python backend/audit_data_quality.py --fail-on-warnings
          
          echo "Exporting graph to JSON..."
          venv/bin/python backend/export.py

          echo "Repairing export from persisted approved decisions..."
          venv/bin/python backend/repair_dashboard_from_decisions.py

          echo "Validating published dashboard data..."
          venv/bin/python backend/validate_dashboard_data.py

          echo "Publishing change feeds..."
          venv/bin/python backend/generate_change_feed.py

          echo "Pre-rendering company pages and sitemap..."
          venv/bin/python backend/generate_static_pages.py

      - name: Mint fresh publish token
        # App installation tokens expire after one hour and this job runs for up to
        # four; the checkout token is stale by the time the results are pushed.
        id: push-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HEPHAESTUS_APP_ID }}
          private-key: ${{ secrets.HEPHAESTUS_APP_PRIVATE_KEY }}

      - name: Commit and Push Dashboard Data
        env:
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"

          git add docs/dashboard_data.json docs/link_history.json data/edge_review_decisions.json
          git add docs/changes.json docs/feed.xml
          git add -A docs/company docs/sitemap.xml

          if ! git diff --cached --quiet; then
            git commit -m "Automated AI extraction: Update Supply Chain X-Ray"
            # A conflicting rebase must not be left half-applied on the self-hosted
            # runner, or every later run fails at checkout.
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "Rebase onto origin/main failed; aborted without publishing."
              exit 1
            fi
            git push origin main
          else
            echo "No new edges discovered today. Skipping commit."
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
