name: Local GPU Titan Queue

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write 

jobs:
  run-ai-discovery:
    runs-on: [self-hosted, nvidia-gpu]
    env:
      HEPHAESTUS_REVIEW_MODEL: qwen2.5:14b-instruct
      HEPHAESTUS_REVIEW_LIMIT: "200"
      HEPHAESTUS_REVIEW_MAX_SECONDS: "3300"
      HEPHAESTUS_REVIEW_MIN_CONFIDENCE: "0.85"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Virtual Environment and Dependencies
        run: |
          echo "Creating virtual environment..."
          python3 -m venv venv
          
          echo "Installing dependencies inside venv..."
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - name: Ensure Ollama Review Model
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "Ollama is not installed or not on PATH for this runner."
            exit 1
          fi

          if ! ollama list >/tmp/ollama-list.txt 2>/tmp/ollama-list.err; then
            echo "Ollama is installed but the local service is not responding. Starting ollama serve..."
            nohup ollama serve >/tmp/ollama-serve.log 2>&1 &
            for attempt in $(seq 1 30); do
              if ollama list >/tmp/ollama-list.txt 2>/tmp/ollama-list.err; then
                break
              fi
              sleep 2
            done
          fi

          if ! ollama list >/tmp/ollama-list.txt 2>/tmp/ollama-list.err; then
            echo "Ollama did not become ready. Recent error:"
            cat /tmp/ollama-list.err
            exit 1
          fi

          if ! awk '{print $1}' /tmp/ollama-list.txt | grep -Fx "$HEPHAESTUS_REVIEW_MODEL"; then
            echo "Pulling missing review model: $HEPHAESTUS_REVIEW_MODEL"
            ollama pull "$HEPHAESTUS_REVIEW_MODEL"
          fi

          echo "Ollama review model is ready: $HEPHAESTUS_REVIEW_MODEL"

      - name: Update Market Metrics
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          # Failsafe: Just in case the DB gets deleted from GitHub, rebuild it.
          if [ ! -f "backend/supply_chain.db" ]; then
            echo "No database found! Bootstrapping from scratch..."
            venv/bin/python backend/database.py
            venv/bin/python backend/seed_db.py
          fi
          
          echo "Updating live financial metrics..."
          venv/bin/python backend/update_metrics.py

      - name: Execute Titan Queue & Export
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          echo "Running local GPU discovery..."
          venv/bin/python backend/auto_discover_edges.py --limit 500

          echo "Reapplying persisted edge review decisions..."
          venv/bin/python backend/edge_review_decisions.py apply

          echo "Reviewing pending AI edges with local Ollama model..."
          venv/bin/python backend/review_edges_with_ollama.py \
            --model "$HEPHAESTUS_REVIEW_MODEL" \
            --status pending \
            --limit "$HEPHAESTUS_REVIEW_LIMIT" \
            --apply \
            --max-seconds "$HEPHAESTUS_REVIEW_MAX_SECONDS" \
            --min-approve "$HEPHAESTUS_REVIEW_MIN_CONFIDENCE" \
            --min-reverse "$HEPHAESTUS_REVIEW_MIN_CONFIDENCE" \
            --min-reject "$HEPHAESTUS_REVIEW_MIN_CONFIDENCE" \
            --report reports/ollama_edge_review_daily.csv

          echo "Persisting reviewed edge decisions..."
          venv/bin/python backend/edge_review_decisions.py export

          echo "Auditing relationship quality..."
          venv/bin/python backend/audit_data_quality.py --fail-on-warnings
          
          echo "Exporting graph to JSON..."
          venv/bin/python backend/export.py

      - name: Commit and Push Dashboard Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/dashboard_data.json data/edge_review_decisions.json
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated AI extraction: Update Supply Chain X-Ray"
            git push origin main
          else
            echo "No new edges discovered today. Skipping commit."
          fi
