name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - updates1
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check frontend JavaScript
        run: |
          node --check docs/app.js
          node tests/check_app_link_count.js
          node tests/check_app_behaviors.js

      - name: Check backend Python syntax
        run: python -m compileall backend tests

      - name: Check shell scripts
        run: |
          bash -n run_pipeline.sh
          bash -n scripts/rebuild_db.sh

      - name: Validate published dashboard data
        run: python backend/validate_dashboard_data.py

      - name: Run tests
        run: python -m pytest -q
